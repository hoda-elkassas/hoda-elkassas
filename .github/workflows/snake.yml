# Save this file at: .github/workflows/snake.yml
# inside your special profile repo: https://github.com/hoda-elkassas/hoda-elkassas
# (If that repo doesn't exist yet: create a new repo with the EXACT same name as your
#  username — hoda-elkassas — and GitHub will treat it as your profile README repo.)

name: generate animated snake

on:
  schedule:
    - cron: "0 */6 * * *"   # runs every 6 hours
  workflow_dispatch: {}      # lets you trigger it manually from the Actions tab
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: generate snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: hoda-elkassas
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark

      - name: push snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
